<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ميزان | نظام المحاسبة الداخلي</title>
  <meta name="theme-color" content="#0f766e">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>:root {
  --bg: #f4f6f8; --surface: #ffffff; --surface-2: #f8fafb; --line: #e5e9ee; --line-2: #d6dce3;
  --text: #0f1720; --muted: #64707d; --faint: #9aa4af;
  --brand: #0f766e; --brand-2: #14b8a6; --brand-soft: #e6f4f2; --brand-ink: #ffffff;
  --inc: #059669; --inc-soft: #e7f6ef; --exp: #dc2626; --exp-soft: #fdecec; --tr: #2563eb; --tr-soft: #e8effd;
  --warn: #b45309; --warn-soft: #fdf3e3;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-lg: 0 20px 50px -12px rgba(16, 24, 40, .25);
  --r: 14px; --r-sm: 10px;
  --side: 248px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1015; --surface: #121920; --surface-2: #161f27; --line: #222d37; --line-2: #2c3945;
    --text: #e8edf2; --muted: #93a0ad; --faint: #66727e;
    --brand: #2dd4bf; --brand-2: #5eead4; --brand-soft: #0f2e2b; --brand-ink: #04211e;
    --inc: #34d399; --inc-soft: #0f2a21; --exp: #f87171; --exp-soft: #2f1517; --tr: #60a5fa; --tr-soft: #14223a;
    --warn: #fbbf24; --warn-soft: #2d2410;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 20px 50px -12px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1015; --surface: #121920; --surface-2: #161f27; --line: #222d37; --line-2: #2c3945;
  --text: #e8edf2; --muted: #93a0ad; --faint: #66727e;
  --brand: #2dd4bf; --brand-2: #5eead4; --brand-soft: #0f2e2b; --brand-ink: #04211e;
  --inc: #34d399; --inc-soft: #0f2a21; --exp: #f87171; --exp-soft: #2f1517; --tr: #60a5fa; --tr-soft: #14223a;
  --warn: #fbbf24; --warn-soft: #2d2410;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 20px 50px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
body.no-scroll { overflow: hidden; }
a { color: var(--brand); text-decoration: none; }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; }
button, input, select, textarea { font: inherit; color: inherit; }
.ic { width: 18px; height: 18px; flex: none; }
.num, .money { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; display: inline-block; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .muted-p { color: var(--muted); margin: 0 0 8px; }
.inc { color: var(--inc); } .exp { color: var(--exp); } .tr { color: var(--tr); }
.hide { display: none !important; }

/* boot & spinner */
.boot { min-height: 100vh; display: grid; place-content: center; gap: 12px; text-align: center; color: var(--muted); }
.spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; margin: auto; }
.spinner.sm { width: 16px; height: 16px; border-width: 2px; display: inline-block; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------------- layout */
.shell { display: grid; grid-template-columns: var(--side) 1fr; min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; background: var(--surface); border-inline-end: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 12px; gap: 6px; z-index: 30; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 14px; }
.brand-logo { width: 36px; height: 36px; border-radius: 10px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; flex: none; overflow: hidden; }
.brand-logo img { width: 100%; height: 100%; object-fit: cover; }
.brand b { display: block; font-size: 16px; } .brand small { color: var(--muted); font-size: 12px; }
.co-switch { display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 10px; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r-sm); cursor: pointer; text-align: start; margin-bottom: 8px; }
.co-switch:hover { border-color: var(--line-2); }
.co-switch .t { flex: 1; min-width: 0; } .co-switch .t b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; } .co-switch .t small { color: var(--muted); font-size: 11px; }
.nav { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow: auto; }
.nav-sec { font-size: 11px; color: var(--faint); padding: 12px 10px 4px; font-weight: 600; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 9px; color: var(--muted); font-weight: 500; }
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a.active { background: var(--brand-soft); color: var(--brand); }
.side-foot { border-top: 1px solid var(--line); padding-top: 10px; display: flex; align-items: center; gap: 8px; }
.side-foot .who { flex: 1; min-width: 0; font-size: 12px; } .side-foot .who b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 12px; padding: 14px 28px; border-bottom: 1px solid var(--line); }
.top h1 { font-size: 20px; flex: 1; }
.top .menu-btn { display: none; }
.view { padding: 24px 28px 60px; max-width: 1400px; width: 100%; }
.demo-bar { background: var(--warn-soft); color: var(--warn); font-size: 12.5px; padding: 7px 28px; display: flex; gap: 8px; align-items: center; }
.scrim { display: none; }

@media (max-width: 960px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: fixed; inset-block: 0; inset-inline-start: 0; width: 270px; transform: translateX(100%); transition: transform .25s; box-shadow: var(--shadow-lg); }
  .shell.nav-open .side { transform: none; }
  .shell.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 25; }
  .top { padding: 12px 16px; } .top .menu-btn { display: inline-grid; }
  .view { padding: 16px 16px 60px; } .demo-bar { padding: 7px 16px; }
}

/* ---------------- controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 13.5px; white-space: nowrap; transition: background .15s, border-color .15s, transform .05s; }
.btn:hover { background: var(--surface-2); } .btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); } .btn.primary:hover { filter: brightness(1.07); }
.btn.inc { background: var(--inc); border-color: var(--inc); color: #fff; } .btn.exp { background: var(--exp); border-color: var(--exp); color: #fff; }
.btn.danger { background: var(--exp); border-color: var(--exp); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; } .btn.ghost:hover { background: var(--surface-2); }
.btn.sm { height: 32px; padding: 0 10px; font-size: 12.5px; } .btn.block { width: 100%; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 9px; border: 0; background: transparent; cursor: pointer; color: var(--muted); }
.icon-btn:hover { background: var(--surface-2); color: var(--text); } .icon-btn.danger:hover { color: var(--exp); background: var(--exp-soft); }
.field { display: flex; flex-direction: column; gap: 6px; } .field > span { font-size: 12.5px; font-weight: 600; color: var(--muted); }
.field small { color: var(--faint); font-size: 11.5px; }
.input, .field input:not([type=checkbox]):not([type=radio]):not([type=color]), .field select, .field textarea, select.input {
  height: 40px; width: 100%; border: 1px solid var(--line-2); background: var(--surface); border-radius: 10px; padding: 0 12px; outline: none; transition: border-color .15s, box-shadow .15s; }
.field textarea { height: auto; min-height: 70px; padding: 10px 12px; resize: vertical; }
.input:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
.field input[type=color] { width: 100%; height: 40px; border: 1px solid var(--line-2); border-radius: 10px; padding: 3px; background: var(--surface); }
input[type=number] { direction: ltr; text-align: right; }
input[type=date] { direction: rtl; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.span2 { grid-column: span 2; }
@media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: 1fr; } .span2 { grid-column: auto; } }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.seg.type button.on[data-v=income] { color: var(--inc); } .seg.type button.on[data-v=expense] { color: var(--exp); } .seg.type button.on[data-v=transfer] { color: var(--tr); }
.chk { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 6px 0; } .chk input { width: 17px; height: 17px; accent-color: var(--brand); }

/* ---------------- cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.card-h { display: flex; align-items: center; gap: 10px; padding: 16px 18px 0; flex-wrap: wrap; }
.card-h h3 { font-size: 15px; flex: 1; } .card-h .sub { color: var(--muted); font-size: 12px; }
.card-b { padding: 16px 18px 18px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
.toolbar .grow { flex: 1; }
.search { position: relative; min-width: 220px; flex: 1; max-width: 340px; }
.search .ic { position: absolute; inset-inline-start: 11px; top: 11px; color: var(--faint); }
.search input { padding-inline-start: 36px !important; }
.grid { display: grid; gap: 16px; }
.g-kpi { grid-template-columns: repeat(4, 1fr); }
.g-2 { grid-template-columns: 1.6fr 1fr; } .g-2e { grid-template-columns: 1fr 1fr; }
@media (max-width: 1150px) { .g-kpi { grid-template-columns: repeat(2, 1fr); } .g-2, .g-2e { grid-template-columns: 1fr; } }
@media (max-width: 520px) { .g-kpi { grid-template-columns: 1fr 1fr; gap: 10px; } }
.mt { margin-top: 16px; }

.kpi { padding: 16px 18px; position: relative; overflow: hidden; }
.kpi .k-top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; font-weight: 600; }
.kpi .k-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
.kpi .k-ic .ic { width: 16px; height: 16px; }
.kpi .k-val { font-size: 23px; font-weight: 700; margin-top: 10px; }
.kpi .k-foot { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.delta { display: inline-flex; align-items: center; gap: 2px; font-weight: 700; padding: 1px 6px; border-radius: 999px; font-size: 11.5px; }
.delta .ic { width: 12px; height: 12px; }
.delta.good { background: var(--inc-soft); color: var(--inc); } .delta.bad { background: var(--exp-soft); color: var(--exp); } .delta.flat { background: var(--surface-2); color: var(--muted); }
@media (max-width: 520px) { .kpi { padding: 12px; } .kpi .k-val { font-size: 17px; } }
.chart-box { position: relative; height: 290px; } .chart-box.sm { height: 230px; }

/* ---------------- tables */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: start; font-weight: 600; color: var(--muted); font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; position: sticky; top: 0; }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover { background: var(--surface-2); }
.tbl tr.click { cursor: pointer; }
.tbl .end { text-align: end; } .tbl .nowrap { white-space: nowrap; }
.tbl tfoot td { font-weight: 700; background: var(--surface-2); border-top: 1px solid var(--line-2); }
.t-desc b { display: block; font-weight: 600; } .t-desc small { color: var(--muted); }
.actions { display: flex; gap: 2px; justify-content: flex-end; }
.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty .ic { width: 40px; height: 40px; color: var(--faint); margin-bottom: 8px; }
.empty h4 { color: var(--text); margin-bottom: 4px; font-size: 15px; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.badge.income { background: var(--inc-soft); color: var(--inc); border-color: transparent; }
.badge.expense { background: var(--exp-soft); color: var(--exp); border-color: transparent; }
.badge.transfer { background: var(--tr-soft); color: var(--tr); border-color: transparent; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }
.avatar { display: inline-grid; place-items: center; border-radius: 50%; background: hsl(var(--h) 55% 88%); color: hsl(var(--h) 55% 28%); font-weight: 700; flex: none; }
:root[data-theme="dark"] .avatar { background: hsl(var(--h) 35% 22%); color: hsl(var(--h) 60% 80%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .avatar { background: hsl(var(--h) 35% 22%); color: hsl(var(--h) 60% 80%); } }
.user-chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; white-space: nowrap; }

.bar { height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--brand); }
.bar.over > i { background: var(--exp); }
.rank { display: flex; flex-direction: column; gap: 12px; }
.rank-row { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; font-size: 13px; }
.rank-row .bar { grid-column: span 2; }

/* gateways */
.gw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.gw-card { padding: 18px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; cursor: pointer; transition: border-color .15s, transform .15s; }
.gw-card:hover { border-color: var(--line-2); transform: translateY(-1px); }
.gw-card::before { content: ''; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
.gw-head { display: flex; align-items: center; gap: 10px; }
.gw-ic { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
.gw-head .t { flex: 1; min-width: 0; } .gw-head b { display: block; font-size: 15px; } .gw-head small { color: var(--muted); font-size: 12px; }
.gw-bal small { color: var(--muted); font-size: 12px; } .gw-bal div { font-size: 22px; font-weight: 700; }
.gw-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-top: 1px dashed var(--line); padding-top: 12px; }
.gw-stats small { display: block; color: var(--muted); font-size: 11px; } .gw-stats b { font-size: 13px; }

/* categories */
.cat-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.cat-row:last-child { border-bottom: 0; }
.cat-row .t { flex: 1; min-width: 0; } .cat-row .t b { font-weight: 600; }

/* permissions grid */
.perm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 18px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--surface-2); }
.perm-grid h5 { grid-column: 1 / -1; margin: 8px 0 0; font-size: 12px; color: var(--faint); }
@media (max-width: 640px) { .perm-grid { grid-template-columns: 1fr; } }
.role-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.role-pick label { border: 1px solid var(--line-2); border-radius: 11px; padding: 10px 12px; cursor: pointer; display: block; }
.role-pick label:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.role-pick input { display: none; } .role-pick b { font-size: 13px; display: block; } .role-pick small { color: var(--muted); font-size: 11.5px; }

/* modal */
.modal-wrap { position: fixed; inset: 0; background: rgba(9, 14, 20, .5); display: grid; place-items: center; padding: 16px; z-index: 100; opacity: 0; transition: opacity .18s; }
.modal-wrap.show { opacity: 1; }
.modal { background: var(--surface); border-radius: 18px; width: min(560px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: var(--shadow-lg); transform: translateY(8px) scale(.98); transition: transform .18s; border: 1px solid var(--line); }
.modal-wrap.show .modal { transform: none; }
.modal.sm { width: min(420px, 100%); } .modal.lg { width: min(820px, 100%); }
.modal-head { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); } .modal-head h3 { flex: 1; font-size: 16px; }
.modal-body { padding: 18px 20px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
@media (max-width: 640px) { .modal-wrap { place-items: end center; padding: 0; } .modal { border-radius: 18px 18px 0 0; max-height: 92vh; } }

/* toast */
#toast-root { position: fixed; bottom: 20px; inset-inline-start: 50%; transform: translateX(50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { display: flex; align-items: center; gap: 8px; background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; box-shadow: var(--shadow-lg); font-weight: 500; opacity: 0; transform: translateY(10px); transition: all .25s; }
.toast.show { opacity: 1; transform: none; } .toast-err { background: var(--exp); color: #fff; }

/* auth */
.auth { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
.auth-art { background: linear-gradient(150deg, #0f766e, #134e4a 60%, #042f2e); color: #e6fffb; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
.auth-art::after { content: ''; position: absolute; width: 520px; height: 520px; border-radius: 50%; border: 70px solid rgba(255, 255, 255, .05); bottom: -200px; left: -160px; }
.auth-art h2 { font-size: 34px; line-height: 1.35; margin: 18px 0 10px; } .auth-art p { opacity: .8; max-width: 420px; }
.auth-feats { display: grid; gap: 12px; position: relative; z-index: 1; }
.auth-feats div { display: flex; gap: 10px; align-items: center; opacity: .92; }
.auth-feats .ic { background: rgba(255, 255, 255, .12); padding: 7px; width: 32px; height: 32px; border-radius: 9px; }
.auth-form { display: grid; place-items: center; padding: 32px 20px; }
.auth-box { width: min(400px, 100%); display: flex; flex-direction: column; gap: 14px; }
.auth-box h1 { font-size: 24px; } .auth-box .sw { text-align: center; color: var(--muted); font-size: 13px; }
.link-btn { background: none; border: 0; color: var(--brand); cursor: pointer; font-weight: 600; padding: 0; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 11px; padding: 10px 12px; font-size: 12.5px; }
.note.info { background: var(--brand-soft); color: var(--brand); }
@media (max-width: 860px) { .auth { grid-template-columns: 1fr; } .auth-art { display: none; } }

/* onboarding */
.onb { max-width: 760px; margin: 40px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 18px; }
.co-list { display: grid; gap: 10px; }
.co-item { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
.co-item:hover { border-color: var(--brand); }

/* audit */
.audit-item { display: flex; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.audit-item:last-child { border-bottom: 0; }
.audit-item .body { flex: 1; min-width: 0; }
.audit-item .line { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.audit-item .meta { color: var(--faint); font-size: 12px; margin-top: 2px; }
.act { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 6px; }
.act.create, .act.join, .act.import { background: var(--inc-soft); color: var(--inc); } .act.update, .act.invite { background: var(--tr-soft); color: var(--tr); } .act.delete { background: var(--exp-soft); color: var(--exp); }
.diff { margin-top: 8px; font-size: 12px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.diff div { display: grid; grid-template-columns: 120px 1fr 1fr; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.diff div:last-child { border-bottom: 0; }
.diff .o { color: var(--exp); text-decoration: line-through; } .diff .n { color: var(--inc); }
details summary { cursor: pointer; color: var(--brand); font-size: 12px; margin-top: 4px; }

/* report sheet (always light for export) */
.report-paper { background: #fff; color: #0f1720; border-radius: 14px; border: 1px solid var(--line); padding: 34px; max-width: 1000px; margin: 0 auto; --line: #e5e9ee; --muted: #64707d; --surface-2: #f6f8fa; }
.report-paper .tbl th { background: #f6f8fa; color: #4b5563; position: static; }
.report-paper .tbl td { border-color: #e9edf1; }
.report-paper .tbl tbody tr:hover { background: transparent; }
.report-paper .inc { color: #047857; } .report-paper .exp { color: #b91c1c; } .report-paper .tr { color: #1d4ed8; }
.rep-head { display: flex; align-items: flex-start; gap: 16px; padding-bottom: 18px; border-bottom: 3px solid #0f766e; margin-bottom: 22px; }
.rep-head .logo { width: 58px; height: 58px; border-radius: 12px; background: #0f766e; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 22px; overflow: hidden; flex: none; }
.rep-head .logo img { width: 100%; height: 100%; object-fit: cover; }
.rep-head .t { flex: 1; } .rep-head h2 { font-size: 22px; } .rep-head .meta { text-align: end; font-size: 12px; color: #64707d; line-height: 1.8; }
.rep-title { font-size: 13px; color: #0f766e; font-weight: 700; }
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px; }
.kpi-row > div { border: 1px solid #e5e9ee; border-radius: 11px; padding: 12px 14px; background: #fafbfc; }
.kpi-row small { color: #64707d; font-size: 11.5px; display: block; } .kpi-row b { font-size: 17px; }
.rep-block { margin-bottom: 24px; } .rep-block h4 { font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.rep-block h4::before { content: ''; width: 4px; height: 16px; background: #0f766e; border-radius: 3px; }
.rep-foot { margin-top: 26px; padding-top: 14px; border-top: 1px solid #e5e9ee; display: flex; justify-content: space-between; color: #9aa4af; font-size: 11px; }
.rep-sign { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 30px; margin-top: 40px; font-size: 12px; color: #64707d; text-align: center; }
.rep-sign div { border-top: 1px solid #cbd2d9; padding-top: 8px; }
body.exporting .report-paper { border: 0; border-radius: 0; box-shadow: none; }
@media (max-width: 760px) { .report-paper { padding: 18px; } .kpi-row { grid-template-columns: 1fr 1fr; } .rep-head { flex-wrap: wrap; } .rep-head .meta { text-align: start; } }
.rep-layout { display: grid; grid-template-columns: 290px 1fr; gap: 18px; align-items: start; }
.rep-layout .filters { position: sticky; top: 80px; }
@media (max-width: 1100px) { .rep-layout { grid-template-columns: 1fr; } .rep-layout .filters { position: static; } }
.rep-scroll { overflow-x: auto; }

.pager { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12.5px; gap: 8px; flex-wrap: wrap; }
.sum-strip { display: flex; gap: 22px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 13px; }
.sum-strip span { color: var(--muted); } .sum-strip b { margin-inline-start: 6px; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
.back .ic { transform: scaleX(-1); width: 16px; }
.pill-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); }
.logo-prev { width: 64px; height: 64px; border-radius: 14px; border: 1px dashed var(--line-2); display: grid; place-items: center; overflow: hidden; color: var(--faint); }
.logo-prev img { width: 100%; height: 100%; object-fit: cover; }
.sect-title { font-size: 13px; font-weight: 700; color: var(--muted); margin: 26px 0 10px; }

@media print {
  .side, .top, .demo-bar, .filters, .no-print, #toast-root { display: none !important; }
  .shell { display: block; } .view { padding: 0; max-width: none; }
  .report-paper { border: 0; padding: 0; }
  body { background: #fff; }
}
@media (max-width: 520px) { .hide-sm { display: none; } .top h1 { font-size: 17px; } }
td.money, th.money, td.num { display: table-cell; }
.sum-strip > div { display: flex; gap: 6px; align-items: baseline; } .sum-strip b { margin: 0; }
.gw-bal div.money { display: block; }
.taxc { color: var(--warn); }
.badge.tax { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.tax-box { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; padding: 12px 14px; border: 1px dashed var(--line-2); border-radius: 12px; background: var(--surface-2); }
.tax-box .field { flex: 1; min-width: 120px; }
.tax-box .chk { min-width: 140px; padding-bottom: 10px; }
.tax-box.off .field { opacity: .4; pointer-events: none; }
.report-paper .taxc { color: #b45309; }
.report-paper .tbl { font-size: 11.5px; }
.report-paper .tbl th, .report-paper .tbl td { padding: 8px 6px; }
.report-paper .tbl td:nth-child(3) { min-width: 150px; }
